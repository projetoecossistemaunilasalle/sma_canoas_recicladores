services:
  - type: pserv
    name: sma-canoas-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: sma-canoas-db
          property: connectionString

  - type: web
    name: sma-canoas-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: BACKEND_URL
        value: https://sma-canoas-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: /api

databases:
  - name: sma-canoas-db
    databaseName: recicladores
    user: postgres
    plan: free
