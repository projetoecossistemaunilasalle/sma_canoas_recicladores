# Only the database runs in Docker for development; the backend and frontend
# run locally (`pnpm dev` / `npm run dev`) against it — see README.md.
services:
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: sma-canoas-db
    environment:
      POSTGRES_DB: recicladores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recicladores"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
